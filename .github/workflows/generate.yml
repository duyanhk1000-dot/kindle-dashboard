name: Render Kindle Dashboard

on:
  schedule:
    # Runs at 22:30 UTC (05:30 ICT) and 10:30 UTC (17:30 ICT) every day
    - cron: '30 22,10 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Dashboard Renderer (Gemini-2.5-Flash Pipeline)
        run: |
          python render_dashboard.py

      - name: Commit and Push dashboard.png
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.png
          git commit -m "Auto-render Kindle Dashboard [$(date -u +'%Y-%m-%d %H:%M UTC')]" || exit 0
          git push
